# Project tooling config. Linting/formatting via Ruff:
#   pip install ruff && ruff check . && ruff format --check .
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# pycodestyle (E/W), pyflakes (F), isort (I), bugbear (B).
select = ["E", "F", "I", "W", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]   # allow longer lines in test assertions

[tool.pytest.ini_options]
# Put the project root on the import path so tests can `from src...` / `import main`
# without manual sys.path manipulation in conftest.
pythonpath = ["."]
testpaths = ["tests"]
